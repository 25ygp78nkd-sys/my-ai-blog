<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>暮らしと仕事の情報ブログ</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#263238;background:#f5f7fa;line-height:1.8}
header{background:#fff;padding:22px 18px;border-bottom:1px solid #ddd}
header h1{margin:0;color:#245b50;font-size:24px}
header p{margin:4px 0 0;color:#667}
nav{background:#245b50;padding:12px 18px}
nav a{color:white;text-decoration:none;margin-right:18px;font-size:14px}
main{max-width:850px;margin:28px auto;padding:0 16px}
.hero{background:#e5f1ec;padding:32px 22px;border-radius:14px}
.hero h2{font-size:25px;margin:0 0 12px;color:#245b50}
.card{background:#fff;padding:22px;margin:18px 0;border-radius:12px;border:1px solid #e2e6e8}
.card h3{margin-top:0;color:#245b50}

<body>
<header>
<h1>暮らしと仕事の情報ブログ</h1>
<p>毎日に役立つ情報を、わかりやすくお届けします。</p>
</header>
<nav>
<a href="#about">ブログについて</a>
<a href="#topics">記事カテゴリー</a>
</nav>
<main>
<section class="hero">
<h2>知りたいことを、わかりやすく。</h2>
<p>仕事・暮らし・健康・お金など、日々の疑問や悩みを解決するヒントを紹介していきます。</p>
</section>
<section id="about" class="card">
<h3>このブログについて</h3>
<p>このブログでは、毎日の生活に役立つ情報を調べ、初心者にもわかりやすい言葉で紹介します。</p>
<p>内容を確認しながら、少しずつ記事を充実させていきます。</p>
</section>
<section id="topics" class="card">
<h3>記事カテゴリー</h3>
<ul>
<li>仕事・働き方</li>
<li>暮らし・生活の工夫</li>
<li>健康・身体の知識</li>
<li>お金・節約・副業</li>
</ul>
<p>記事はこれから順次追加していきます。</p>
</section>
</main>
<footer>© 暮らしと仕事の情報ブログ</footer>
